name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra test
      - run: uv run pytest -q -m "not live and not full"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test desktop/plugin.test.mjs
      - run: npm ci
        working-directory: desktop
      - run: npx playwright install chromium
        working-directory: desktop
      - run: node desktop/build-harness.mjs
      - run: node desktop/arena.browser.test.mjs
      - run: uv run python scripts/build_catalog.py --check
